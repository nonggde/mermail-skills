interface:
  display_name: "Mermail Outbound Privacy Gate"
  short_description: "Catch sensitive-data leaks and recipient or link drift before an email leaves Mermail."
  default_prompt: "Use $mermail-outbound-privacy-gate to audit this selected draft before delivery."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
